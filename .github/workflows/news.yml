name: News

on:
  schedule:
    - cron: "*/30 * * * *"        # страховка: следующий «живой» запуск всегда ждёт в очереди и стартует, как только закончится предыдущий
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробный запуск: показать посты в логе, но НЕ публиковать в канал"
        type: boolean
        default: true
      loop:
        description: "Режим реального времени (работать ~5,5 часа, проверка каждую минуту). Выключено = один проход"
        type: boolean
        default: false

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run news bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FEED_URL: ${{ secrets.FEED_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          # необязательные настройки (раздел Variables): если не заданы, берутся значения по умолчанию
          SITE_URL: ${{ vars.SITE_URL }}
          LINK_REGEX: ${{ vars.LINK_REGEX }}
          MAX_PER_RUN: ${{ vars.MAX_PER_RUN }}
          FIRST_RUN_POSTS: ${{ vars.FIRST_RUN_POSTS }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
          SUMMARY_MIN: ${{ vars.SUMMARY_MIN }}
          SUMMARY_MAX: ${{ vars.SUMMARY_MAX }}
          TITLE_PREFIX: ${{ vars.TITLE_PREFIX }}
          REPEAT_TITLE: ${{ vars.REPEAT_TITLE }}
          LLM_ORDER: ${{ vars.LLM_ORDER }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          SKIP_CATEGORIES: ${{ vars.SKIP_CATEGORIES }}
          USE_PHOTOS: ${{ vars.USE_PHOTOS }}
          FALLBACK_IMAGE_URL: ${{ vars.FALLBACK_IMAGE_URL }}
          LLM_BUDGET: ${{ vars.LLM_BUDGET }}
          RUN_BUDGET: ${{ vars.RUN_BUDGET }}
          POLL_SECONDS: ${{ vars.POLL_SECONDS }}
          RETRY_DELAY: ${{ vars.RETRY_DELAY }}
          LOOP_SECONDS: ${{ (github.event_name == 'schedule' || github.event.inputs.loop == 'true') && '20100' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python -m news_bot.run_once
      - name: Keep schedule alive (best effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/news.yml/enable" || true
